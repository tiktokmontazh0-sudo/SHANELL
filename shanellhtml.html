<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SHANEL</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, 'Segoe UI', sans-serif; }
  body { background:#0e1621; color:#fff; height:100vh; overflow:hidden; display:flex; }

  .sidebar { width:100%; max-width:380px; background:#17212b; border-right:1px solid #101921; display:flex; flex-direction:column; height:100vh; }
  .sidebar-header { padding:10px 16px; background:#17212b; border-bottom:1px solid #101921; display:flex; align-items:center; gap:12px; height:56px; }
  .menu { font-size:22px; color:#e53935; cursor:pointer; }
  .search-box { flex:1; display:flex; align-items:center; background:#242f3d; border-radius:20px; padding:6px 14px; gap:8px; }
  .search-box input { flex:1; background:transparent; border:none; color:#fff; font-size:14px; outline:none; }

  .chat-list { flex:1; overflow-y:auto; }
  .empty-chats { padding:60px 20px; text-align:center; color:#708499; font-size:14px; }

  .chat-item { display:flex; align-items:center; padding:10px 16px; gap:12px; cursor:pointer; border-bottom:1px solid #1a2531; }
  .chat-item:hover { background:#202b36; }

  .avatar { width:54px; height:54px; border-radius:50%; background:#e53935; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; flex-shrink:0; }
  .avatar.green { background:#4caf50; }
  .avatar.blue { background:#2196f3; }
  .avatar.purple { background:#9c27b0; }
  .avatar.orange { background:#ff9800; }

  .chat-info { flex:1; min-width:0; }
  .chat-info .name { font-size:15px; font-weight:600; margin-bottom:3px; }
  .chat-info .last { font-size:14px; color:#708499; }

  .chat-area { flex:1; display:flex; flex-direction:column; background:#0e1621; height:100vh; }
  .chat-header { background:#17212b; padding:10px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #101921; height:56px; }
  .back { font-size:22px; color:#e53935; cursor:pointer; display:none; }
  .chat-header .info { flex:1; }
  .chat-header .name { font-size:16px; font-weight:600; }
  .chat-header .status { font-size:13px; color:#4caf50; }

  .messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:70%; padding:8px 14px; border-radius:14px; font-size:15px; line-height:1.4; word-wrap:break-word; }
  .msg.other { background:#182533; align-self:flex-start; }
  .msg.mine { background:#2196f3; align-self:flex-end; }
  .msg .time { font-size:11px; color:rgba(255,255,255,0.6); float:right; margin-left:8px; margin-top:4px; }

  .input-area { background:#17212b; padding:10px 16px; display:flex; align-items:center; gap:10px; border-top:1px solid #101921; }
  .input-area input[type="text"] { flex:1; background:#242f3d; border:none; border-radius:22px; padding:12px 18px; color:#fff; font-size:15px; outline:none; }
  .input-area .send { width:44px; height:44px; border-radius:50%; background:#2196f3; border:none; color:#fff; font-size:18px; cursor:pointer; }

  #loginScreen { position:fixed; top:0; left:0; width:100%; height:100%; background:#0e1621; display:flex; justify-content:center; align-items:center; z-index:999; padding:16px; }
  .login-box { width:100%; max-width:380px; background:#17212b; padding:36px 28px; border-radius:24px; text-align:center; }
  .login-box h1 { color:#e53935; font-size:36px; margin-bottom:6px; letter-spacing:4px; }
  .login-box p { color:#708499; font-size:14px; margin-bottom:28px; }
  .login-box input { width:100%; background:#242f3d; border:none; border-radius:14px; padding:15px; color:#fff; font-size:15px; margin-bottom:12px; outline:none; }
  .login-box button { width:100%; background:#e53935; border:none; border-radius:14px; padding:15px; color:#fff; font-size:16px; font-weight:600; cursor:pointer; }

  @media (max-width:700px) {
    .sidebar { width:100%; max-width:100%; }
    .chat-area { position:fixed; top:0; left:0; width:100%; height:100%; z-index:100; display:none; }
    .chat-area.open { display:flex; }
    .back { display:block; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>SHANEL</h1>
    <p>Мессенджер для своих</p>
    <input id="nameInput" placeholder="Имя" />
    <input id="usernameInput" placeholder="Юзернейм (@username)" />
    <button id="loginBtn">Создать аккаунт</button>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="menu">☰</div>
    <div class="search-box"><input placeholder="Поиск..." /></div>
  </div>
  <div class="chat-list" id="chatList"></div>
</div>

<div class="chat-area" id="chatArea">
  <div class="chat-header">
    <div class="back" id="backBtn">←</div>
    <div class="avatar" id="chatAvatar">A</div>
    <div class="info">
      <div class="name" id="chatName">Чат</div>
      <div class="status">онлайн</div>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input type="text" id="msgInput" placeholder="Написать сообщение..." />
    <button class="send" id="sendBtn">➤</button>
  </div>
</div>

<script>
// ⚠️ ЗАМЕНИ НА СВОЮ ССЫЛКУ ПОСЛЕ ДЕПЛОЯ НА RENDER
const API_URL = 'https://shanel.onrender.com';

let currentUser = null;
let currentChat = null;

document.getElementById('loginBtn').onclick = async () => {
  const name = document.getElementById('nameInput').value.trim();
  let username = document.getElementById('usernameInput').value.trim();
  if (!name || !username) return alert('Заполни все поля');
  if (!username.startsWith('@')) username = '@' + username;

  const res = await fetch(API_URL + '/api/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, username })
  });
  const data = await res.json();
  if (data.success) {
    currentUser = data.user;
    localStorage.setItem('shanel_user', JSON.stringify(currentUser));
    document.getElementById('loginScreen').style.display = 'none';
    loadUsers();
  }
};

const saved = localStorage.getItem('shanel_user');
if (saved) {
  currentUser = JSON.parse(saved);
  document.getElementById('loginScreen').style.display = 'none';
  loadUsers();
}

async function loadUsers() {
  const res = await fetch(API_URL + '/api/users');
  const users = await res.json();
  const list = document.getElementById('chatList');
  const others = users.filter(u => u.id !== currentUser.id);

  if (others.length === 0) {
    list.innerHTML = '<div class="empty-chats">📭 Пока нет пользователей</div>';
    return;
  }

  const colors = ['green', 'blue', 'purple', 'orange'];
  list.innerHTML = others.map(u => {
    const color = colors[u.name.charCodeAt(0) % colors.length];
    return `
      <div class="chat-item" onclick="openChat('${u.id}', '${u.name}')">
        <div class="avatar ${color}">${u.name[0].toUpperCase()}</div>
        <div class="chat-info">
          <div class="name">${u.name}</div>
          <div class="last">${u.username}</div>
        </div>
      </div>
    `;
  }).join('');
}

window.openChat = async function(userId, name) {
  currentChat = { id: userId, name };
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatAvatar').textContent = name[0].toUpperCase();
  document.getElementById('chatArea').classList.add('open');
  loadMessages();
};

async function loadMessages() {
  const res = await fetch(API_URL + '/api/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: currentUser.id, to: currentChat.id })
  });
  const msgs = await res.json();
  const box = document.getElementById('messages');
  box.innerHTML = msgs.map(m => `
    <div class="msg ${m.sender === currentUser.id ? 'mine' : 'other'}">
      ${m.text}
      <span class="time">${new Date(m.time).toLocaleTimeString().slice(0,5)}</span>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChat) return;

  await fetch(API_URL + '/api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: currentUser.id, to: currentChat.id, text })
  });

  input.value = '';
  loadMessages();
}

document.getElementById('sendBtn').onclick = send;
document.getElementById('msgInput').onkeydown = (e) => { if (e.key === 'Enter') send(); };
document.getElementById('backBtn').onclick = () => {
  document.getElementById('chatArea').classList.remove('open');
  currentChat = null;
};

setInterval(() => { if (currentChat) loadMessages(); }, 3000);
</script>

</body>
</html>
